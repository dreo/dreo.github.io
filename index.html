<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141613">
    <title>Ondrej Ilcik – I make quiet tools for loud problems.</title>
    <meta name="description" content="I make quiet tools for loud problems.">
    <meta name="author" content="Ondrej Ilcik">
    <link rel="canonical" href="https://ilcik.com/">

    <!-- Open Graph -->
    <meta property="og:title" content="Ondrej Ilcik">
    <meta property="og:description" content="I make quiet tools for loud problems.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ilcik.com/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ondrej Ilcik">
    <meta name="twitter:description" content="I make quiet tools for loud problems.">

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ondrej Ilcik",
        "url": "https://ilcik.com/",
        "description": "I make quiet tools for loud problems."
    }
    </script>

    <style>

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: auto 1fr; padding: 36px 48px 62px; background: var(--ground); color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    header { display: flex; align-items: center; }
    h1, p { margin: 0; }
    a { color: inherit; text-underline-offset: .25em; }
    a, summary { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    a:focus-visible, summary:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    .reveal { min-height: 112px; }
    .reveal summary { min-height: 44px; width: fit-content; display: flex; align-items: center; gap: 24px; cursor: pointer; list-style: none; color: var(--ink); font-size: 12px; line-height: 1.5; }
    .reveal summary::-webkit-details-marker { display: none; }
    .reveal summary::after { content: "+"; font-size: 16px; font-weight: 400; }
    .reveal[open] summary::after { content: "−"; }
    .reveal summary:hover { color: var(--ink); }
    .reveal .contact { min-height: 44px; display: flex; align-items: center; color: var(--ink); }
    .reveal .contact:empty { display: none; }
    .contact-image { display: block; width: 190px; max-width: 100%; height: auto; }
    .contact-help { font-size: 12px; line-height: 1.6; color: var(--muted); }
    .reveal[open] .contact { animation: disclose 180ms ease-out; }
    @keyframes disclose { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { body { padding: 24px 24px 56px; } }
    @media (prefers-reduced-motion: reduce) { .reveal[open] .contact { animation: none; } }

    :root { color-scheme: dark; --ground: #141613; --ink: #d4d7cd; --muted: #91978c; --rule: #41473d; }
    .initials { font-family: "Times New Roman", Times, serif; font-size: 21px; letter-spacing: -.08em; line-height: 1; color: var(--ink); }
    main { display: flex; align-items: center; padding: 70px 0 35px; }
    .entry { margin-left: 43%; width: min(100%, 460px); display: grid; grid-template-columns: 1px 1fr; column-gap: 37px; }
    .hairline { height: 170px; background: var(--rule); margin-top: 3px; }
    .name { font-size: 10px; font-weight: 400; letter-spacing: .17em; text-transform: uppercase; margin-bottom: 35px; color: var(--muted); }
    h1 { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: clamp(24px, 2.4vw, 32px); font-weight: 400; letter-spacing: -.025em; line-height: 1.45; }
    h1 span { display: block; }
    .reveal { margin-top: 32px; }
    .reveal summary { color: var(--muted); font-size: 11px; gap: 36px; }
    @media (max-width: 800px) { .entry { margin-left: 23%; } }
    @media (max-width: 600px) {
      main { padding: 70px 0 35px; }
      .entry { margin-left: 4%; column-gap: 22px; }
      .name { font-size: 9px; letter-spacing: .13em; }
      h1 { font-size: clamp(22px, 6.2vw, 29px); }
    }
    </style>
</head>
<body>
  <header><span class="initials" aria-hidden="true">oi.</span></header>
  <main>
    <div class="entry">
      <div class="hairline" aria-hidden="true"></div>
      <div>
        <p class="name">Ondrej Ilcik</p>
        <h1><span>I make quiet tools</span> <span>for loud problems.</span></h1>
        <details class="reveal">
          <summary>Correspondence</summary>
          <div id="contact" class="contact" aria-live="polite"></div>
          <noscript><p class="contact-help">Enable JavaScript to reveal the email address.</p></noscript>
        </details>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const reveal = document.querySelector('.reveal');
      const contact = document.getElementById('contact');

      // Fixed 95 × 7 artwork: pixel rows, not character codes or an encoded string.
      // Rendering never constructs text. The image remains recoverable with OCR.
      const pixels = [
        [114, 47, 60, 248, 39, 28, 129, 199, 34, 1, 199, 34],
        [139, 40, 162, 128, 40, 136, 130, 34, 36, 2, 40, 182],
        [138, 168, 162, 128, 43, 136, 130, 2, 40, 2, 8, 170],
        [138, 104, 188, 240, 42, 136, 130, 2, 48, 2, 8, 162],
        [138, 40, 168, 130, 43, 136, 130, 2, 40, 2, 8, 162],
        [138, 40, 164, 130, 40, 8, 130, 34, 36, 98, 40, 162],
        [114, 47, 34, 249, 199, 156, 249, 199, 34, 97, 199, 34]
      ];

      reveal.addEventListener('toggle', () => {
        contact.replaceChildren();
        if (!reveal.open) return;

        const canvas = document.createElement('canvas');
        canvas.className = 'contact-image';
        canvas.width = 380;
        canvas.height = 28;
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Email address shown as a pixel image. Read and type it into your email app.');

        const context = canvas.getContext('2d');
        if (!context) {
          contact.textContent = 'Your browser cannot display the contact image.';
          return;
        }
        context.fillStyle = getComputedStyle(contact).color;
        for (let row = 0; row < pixels.length; row++) {
          for (let column = 0; column < 95; column++) {
            if ((pixels[row][column >> 3] >> (7 - column % 8)) & 1) {
              context.fillRect(column * 4, row * 4, 3, 3);
            }
          }
        }
        contact.append(canvas);
      });
    })();
  </script>
</body>
</html>
